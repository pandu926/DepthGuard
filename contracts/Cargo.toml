[workspace]
members = ["programs/*", "crates/*"]
resolver = "2"
[workspace.dependencies]
anchor-lang = { version = "=1.0.2", features = ["event-cpi"] }
anchor-spl = { version = "=1.0.2", default-features = false, features = ["token", "token_2022", "associated_token"] }
economy-core = { path = "crates/economy-core" }
bytemuck = "1"
sha2 = "0.10"
dynamic-bonding-curve = { git = "https://github.com/MeteoraAg/dynamic-bonding-curve.git", rev = "f552f20aa3c1c7631427c3827aeea7c58b902813", features = ["cpi"] }
cp-amm = { git = "https://github.com/MeteoraAg/damm-v2.git", rev = "a85c926607433f23f0ea60f4ca7b1ae92f4156cb", features = ["cpi", "no-custom-entrypoint"] }
dynamic-fee-sharing = { git = "https://github.com/MeteoraAg/dynamic-fee-sharing.git", rev = "3e327c1ab085246612d28da21e1a78c7008119fe", features = ["cpi"] }
anchor-attribute-access-control = "=1.0.2"
anchor-attribute-account = "=1.0.2"
anchor-attribute-constant = "=1.0.2"
anchor-attribute-error = "=1.0.2"
anchor-attribute-event = "=1.0.2"
anchor-attribute-program = "=1.0.2"
anchor-derive-accounts = "=1.0.2"
anchor-derive-serde = "=1.0.2"
anchor-derive-space = "=1.0.2"
anchor-syn = "=1.0.2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
