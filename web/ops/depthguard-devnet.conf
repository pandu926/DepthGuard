# Include inside the existing cashtokens-nginx http context.
# Only the frontend binds to the host's private Docker bridge address.
server {
    listen 80;
    server_name depthguard.rbexp.com;

    # Cloudflare Flexible forwards HTTPS visitors over HTTP to the origin.
    # Preserve that path without creating a redirect loop.
    if ($http_x_forwarded_proto != "https") {
        return 308 https://depthguard.rbexp.com$request_uri;
    }

    client_max_body_size 2m;
    location / {
        proxy_pass http://172.18.0.1:5176;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 330s;
        proxy_send_timeout 330s;
        proxy_buffering off;
    }
}

server {
    listen 443 ssl;
    server_name depthguard.rbexp.com;
    ssl_certificate /etc/nginx/ssl/depthguard-origin.crt;
    ssl_certificate_key /etc/nginx/ssl/depthguard-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:depthguard_tls:10m;
    ssl_session_timeout 1d;

    client_max_body_size 2m;
    location / {
        proxy_pass http://172.18.0.1:5176;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 330s;
        proxy_send_timeout 330s;
        proxy_buffering off;
    }
}
