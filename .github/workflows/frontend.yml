name: Consumer frontend
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run repo:check
      - run: npm run check
      - run: npm run web:test
      - run: npm run build
      - run: npm run web:transport:test
      - uses: actions/upload-artifact@v4
        with:
          name: consumer-web
          path: web/dist
          retention-days: 7
